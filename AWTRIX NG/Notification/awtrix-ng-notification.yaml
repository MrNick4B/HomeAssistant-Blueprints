blueprint:
  name: "AWTRIX NG Notification"
  description: "Send a notification to AWTRIX NG via MQTT."
  domain: automation
  author: "MrNick4B"
  homeassistant:
    min_version: "2025.7.0"
  source_url: "https://github.com/MrNick4B/HomeAssistant-Blueprints/blob/main/AWTRIX%20NG/Notification/awtrix-ng-notification.yaml"
  input:
    section_general:
      name: "General Settings"
      icon: mdi:cog
      description: "Configure the general settings."
      input:
        input_awtrix_device_topic:
          name: "MQTT Prefix"
          description: "Select the MQTT prefix entity of the desired AWTRIX NG device.\n(For example sensor.awtrix_ng_mqtt_prefix)"
          selector:
            entity:
              integration: mqtt
              domain: sensor
        input_duration:
          name: "Duration"
          description: "The duration for which the notification is displayed.\n0 = default duration of the device."
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "s"
        input_stack:
          name: "Stack Notification"
          description: "Wait to show a new notification until the current one is finished.\nWhen disabled, the new notification replaces the one currently shown."
          default: true
          selector:
            boolean:
        input_app_update_trigger:
          name: "Trigger"
          description: "Trigger for displaying the notification."
          default: null
          selector:
            trigger:
        input_app_update_condition:
          name: "Condition"
          description: "Condition for displaying the notification."
          default: null
          selector:
            condition:
    section_text:
      name: "Text"
      icon: mdi:card-text
      description: "Configure the displayed text."
      input:
        input_text:
          name: "Text"
          description: "The text to be displayed. Also supports templates."
          default: null
          selector:
            template:
        input_text_entities:
          name: "Entities"
          description: "Select one or more entities whose status will be displayed."
          default: ""
          selector:
            entity:
              multiple: true
        input_show_units:
          name: "Show Units"
          description: "Choose whether to display the units of the entities."
          default: true
          selector:
            boolean:
    section_icon:
      name: "Icon"
      icon: mdi:image
      description: "Customize the displayed icon."
      input:
        input_icon:
          name: "Icon"
          description: "Enter the ID or name of the icon."
          default: ""
          selector:
            text:
        input_icon_push:
          name: "Icon Movement"
          description: "Choose whether the icon moves with the text and how often this happens."
          default: "fixed"
          selector:
            select:
              options:
                - label: "Stays in place"
                  value: "fixed"
                - label: "Moves once with the text"
                  value: "pushOnce"
                - label: "Moves repeatedly with the text"
                  value: "push"
    section_textformatting:
      name: "Text Options"
      icon: mdi:format-text
      description: "Settings for text display."
      collapsed: true
      input:
        input_text_case:
          name: "Text Case"
          description: "Adjust the case of the text."
          default: "inherit"
          selector:
            select:
              options:
                - label: "Device default setting"
                  value: "inherit"
                - label: "Uppercase only"
                  value: "upper"
                - label: "As entered"
                  value: "asTyped"
        input_blink_text:
          name: "Blinking Text"
          description: "Make the text blink. Does not work if the rainbow effect, a gradient or a palette is enabled."
          default: 0
          selector:
            number:
              min: 0
              max: 5000
              step: 100
              unit_of_measurement: "ms"
        input_fade_text:
          name: "Fade Effect"
          description: "Make the text blink with a fade effect. Takes precedence over blinking text. Does not work if the rainbow effect, a gradient or a palette is enabled."
          default: 0
          selector:
            number:
              min: 0
              max: 5000
              step: 100
              unit_of_measurement: "ms"
        input_scroll_mode:
          name: "Scroll Mode"
          description: "How text that does not fit on the screen moves."
          default: ""
          selector:
            select:
              options:
                - label: "Device default setting"
                  value: ""
                - label: "Scroll through and start over"
                  value: "wrap"
                - label: "Continuous loop"
                  value: "loop"
                - label: "Back and forth"
                  value: "bounce"
                - label: "Do not scroll"
                  value: "static"
        input_scroll_speed:
          name: "Scroll Speed"
          description: "Scroll speed as a percentage of the normal speed.\n0 = default speed of the device."
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 10
              unit_of_measurement: "%"
        input_repeat:
          name: "Repeat Text"
          description: "Keep showing until the scrolling text has run across the screen this many times. When a duration is set, it is shown at least that long.\n0 = off."
          default: 0
          selector:
            number:
              min: 0
              max: 10
              step: 1
    section_colors:
      name: "Color Options"
      icon: mdi:palette
      description: "Customize the text and background colors."
      collapsed: true
      input:
        input_enable_text_color:
          name: "Enable Custom Text Color"
          description: "Does not work if the rainbow effect is enabled."
          default: "0"
          selector:
            select:
              options:
                - label: "No custom color"
                  value: "0"
                - label: "Single color"
                  value: "1"
                - label: "Gradient"
                  value: "2"
                - label: "Palette"
                  value: "3"
        input_text_color_1:
          name: "First Text Color"
          description: "For a gradient, the text starts with this color."
          default: [0, 128, 255]
          selector:
            color_rgb:
        input_text_color_2:
          name: "Second Text Color"
          description: "For a gradient, the text ends with this color."
          default: [255, 0, 128]
          selector:
            color_rgb:
        input_palette:
          name: "Palette"
          description: "Palette for the text when Palette is chosen as text color. You can also enter the name of your own palette file. The palette also colors the background effect and overlay."
          default: "Rainbow"
          selector:
            select:
              custom_value: true
              options:
                - "Rainbow"
                - "Party"
                - "Heat"
                - "Lava"
                - "Ocean"
                - "Forest"
                - "Cloud"
                - "Stripe"
        input_palette_speed:
          name: "Color Movement"
          description: "Let the colors of a rainbow, gradient or palette move along the text, in passes per second.\n0 = no movement."
          default: 0
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
        input_enable_background_color:
          name: "Enable Custom Background Color"
          description: "Enable the background color option. Ignored when a background effect is selected."
          default: false
          selector:
            boolean:
        input_background_color:
          name: "Background Color"
          description: "Choose a custom background color."
          default: [255, 255, 255]
          selector:
            color_rgb:
        input_rainbow:
          name: "Rainbow Effect"
          description: "Give the text a rainbow effect. Overrides custom text color."
          default: false
          selector:
            boolean:
    section_progress:
      name: "Progress Bar"
      icon: mdi:progress-helper
      description: "Show a progress bar on the bottom row."
      collapsed: true
      input:
        input_progress_entity:
          name: "Progress Entity"
          description: "Entity whose state is shown as progress, for example a battery level."
          default: ""
          selector:
            entity:
              domain:
                - sensor
                - number
                - input_number
        input_progress_max:
          name: "Maximum"
          description: "Value at which the progress bar is full. Only needed for sensors that do not report a percentage, for example 200 for a 200 L water tank.\n0 = automatic."
          default: 0
          selector:
            number:
              mode: box
              step: any
        input_progress_min:
          name: "Minimum"
          description: "Value at which the progress bar is empty. Only used when a maximum is set."
          default: 0
          selector:
            number:
              mode: box
              step: any
        input_progress:
          name: "Progress Template"
          description: "Use a template that returns a value between 0 and 100. Overrides the progress entity."
          default: null
          selector:
            template:
        input_progress_color:
          name: "Progress Color"
          description: "Color of the filled part of the progress bar."
          default: [255, 255, 255]
          selector:
            color_rgb:
        input_progress_track_color:
          name: "Track Color"
          description: "Color of the unfilled part of the progress bar."
          default: [96, 96, 96]
          selector:
            color_rgb:
    section_effects:
      name: "Effects"
      icon: mdi:animation
      description: "Manage overlay and background effects."
      collapsed: true
      input:
        input_overlayeffect:
          name: "Overlay Effect"
          description: "Select an overlay effect."
          default: ""
          selector:
            select:
              options:
                - label: "Device default (global overlay)"
                  value: ""
                - label: "Snow"
                  value: "snow"
                - label: "Rain"
                  value: "rain"
                - label: "Drizzle"
                  value: "drizzle"
                - label: "Storm"
                  value: "storm"
                - label: "Thunder"
                  value: "thunder"
                - label: "Frost"
                  value: "frost"
        input_backgroundeffect:
          name: "Background Effect"
          description: "Select a background effect."
          default: ""
          selector:
            select:
              options:
                - label: "No effect"
                  value: ""
                - label: "Fade"
                  value: "Fade"
                - label: "MovingLine"
                  value: "MovingLine"
                - label: "BrickBreaker"
                  value: "BrickBreaker"
                - label: "PingPong"
                  value: "PingPong"
                - label: "Radar"
                  value: "Radar"
                - label: "Checkerboard"
                  value: "Checkerboard"
                - label: "Fireworks"
                  value: "Fireworks"
                - label: "PlasmaCloud"
                  value: "PlasmaCloud"
                - label: "Ripple"
                  value: "Ripple"
                - label: "Snake"
                  value: "Snake"
                - label: "Pacifica"
                  value: "Pacifica"
                - label: "TheaterChase"
                  value: "TheaterChase"
                - label: "Plasma"
                  value: "Plasma"
                - label: "Matrix"
                  value: "Matrix"
                - label: "SwirlIn"
                  value: "SwirlIn"
                - label: "SwirlOut"
                  value: "SwirlOut"
                - label: "LookingEyes"
                  value: "LookingEyes"
                - label: "TwinklingStars"
                  value: "TwinklingStars"
                - label: "ColorWaves"
                  value: "ColorWaves"
    section_sounds:
      name: "Sounds"
      icon: mdi:music
      description: "Settings for sounds. Requires sound to be enabled on the device."
      collapsed: true
      input:
        input_rtttl:
          name: "RTTTL Sound"
          description: "RTTTL sound string to play when the notification is displayed."
          default: ""
          selector:
            text:
        input_loopSound:
          name: "Loop Sound"
          description: "Loop the sound as long as the notification is displayed."
          default: false
          selector:
            boolean:
    section_dismiss:
      name: "Hold and Dismiss"
      icon: mdi:bell-cancel
      description: "Keep the notification on screen and dismiss it automatically."
      collapsed: true
      input:
        input_hold:
          name: "Hold Notification"
          description: "Keep the notification on screen until it is dismissed, ignoring the duration.\nIt can be dismissed with the dismiss trigger below or the middle button on the device."
          default: false
          selector:
            boolean:
        input_notification_name:
          name: "Notification Name"
          description: "Optional name for the notification, used to dismiss exactly this notification. Only letters, digits, _ and - are allowed.\nLeave empty to generate a name automatically."
          default: ""
          selector:
            text:
        input_enable_dismiss:
          name: "Dismiss Automatically"
          description: "Dismiss the notification as soon as the dismiss trigger fires, for example when a door is opened."
          default: false
          selector:
            boolean:
        input_dismiss_trigger:
          name: "Dismiss Trigger"
          description: "Trigger for dismissing the notification. Only used when Dismiss Automatically is enabled."
          default: []
          selector:
            trigger:
    section_advanced:
      name: "Advanced Settings"
      icon: mdi:tune
      description: "Additional settings."
      collapsed: true
      input:
        input_wakeup:
          name: "Wake Up Screen"
          description: "Wake up the screen (matrix) if it is turned off. This does not work if the device is off."
          default: false
          selector:
            boolean:
# Parallel, so a notification that waits for its dismiss trigger does not block new notifications.
# 32 matches the size of the notification queue on the device.
mode: parallel
max: 32

trigger:
  - triggers: !input input_app_update_trigger

condition:
  - and: !input input_app_update_condition

action:
  - variables:
      var_topic: !input input_awtrix_device_topic
      var_text: !input input_text
      var_text_entities: !input input_text_entities
      var_show_units: !input input_show_units
      var_stack: !input input_stack
      var_text_case: !input input_text_case
      var_icon: !input input_icon
      var_icon_push: !input input_icon_push
      var_duration: !input input_duration
      var_rainbow: !input input_rainbow
      var_blink_text: !input input_blink_text
      var_fade_text: !input input_fade_text
      var_scroll_mode: !input input_scroll_mode
      var_scroll_speed: !input input_scroll_speed
      var_repeat: !input input_repeat
      var_enable_text_color: !input input_enable_text_color
      var_text_color_1: !input input_text_color_1
      var_text_color_2: !input input_text_color_2
      var_palette: !input input_palette
      var_palette_speed: !input input_palette_speed
      var_enable_background_color: !input input_enable_background_color
      var_background_color: !input input_background_color
      var_progress: !input input_progress
      var_progress_entity: !input input_progress_entity
      var_progress_min: !input input_progress_min
      var_progress_max: !input input_progress_max
      var_progress_color: !input input_progress_color
      var_progress_track_color: !input input_progress_track_color
      var_overlayeffect: !input input_overlayeffect
      var_backgroundeffect: !input input_backgroundeffect
      var_rtttl: !input input_rtttl
      var_loopSound: !input input_loopSound
      var_hold: !input input_hold
      var_name_input: !input input_notification_name
      var_enable_dismiss: !input input_enable_dismiss
      var_wakeup: !input input_wakeup
      var_topicnotifyname: "{{ states(var_topic) }}/cmd/notify"
      # "active" is reserved by AWTRIX NG for the notification currently on screen.
      var_notification_name: >-
        {%- set n = (var_name_input | string | trim | regex_replace('[^A-Za-z0-9_-]', '_')) if var_name_input else '' -%}
        {%- if n == 'active' -%}{%- set n = 'active_' -%}{%- endif -%}
        {{ n if n else 'ha_' ~ (now().timestamp() * 1000) | int }}
      # Built as a dict and serialized with to_json, so text with quotes stays valid JSON
      # and booleans are sent as true/false (AWTRIX NG skips keys with the wrong JSON type).
      payload_data: >-
        {%- set ns = namespace(result=[]) -%}
        {%- if var_text_entities -%}
          {%- for entity in var_text_entities -%}
            {%- set state = states(entity) -%}
            {%- set unit = state_attr(entity, "unit_of_measurement") -%}
            {%- if state not in ['unknown', 'unavailable', 'None'] -%}
              {%- if var_show_units and unit -%}
                {%- set ns.result = ns.result + [state ~ unit] -%}
              {%- else -%}
                {%- set ns.result = ns.result + [state] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set text = '' if var_text is none else (var_text | string | trim) -%}
        {%- set p = {'text': ([text] + ns.result) | select | join(' '), 'textCase': var_text_case, 'stack': var_stack | bool, 'hold': var_hold | bool, 'wakeup': var_wakeup | bool} -%}
        {%- if var_name_input or var_enable_dismiss -%}
          {%- set p = dict(p, name=var_notification_name | string) -%}
        {%- endif -%}
        {%- if var_rainbow -%}
          {%- set p = dict(p, palette='Rainbow', textColor='palette') -%}
        {%- elif var_enable_text_color == '2' -%}
          {%- set p = dict(p, palette=[var_text_color_1, var_text_color_2], textColor='palette') -%}
        {%- elif var_enable_text_color == '3' and var_palette -%}
          {%- set p = dict(p, palette=var_palette | string, textColor='palette') -%}
        {%- else -%}
          {%- if var_enable_text_color == '1' -%}
            {%- set p = dict(p, textColor=var_text_color_1) -%}
          {%- endif -%}
          {%- if (var_blink_text | int) > 0 -%}
            {%- set p = dict(p, textBlinkMs=var_blink_text | int) -%}
          {%- endif -%}
          {%- if (var_fade_text | int) > 0 -%}
            {%- set p = dict(p, textFadeMs=var_fade_text | int) -%}
          {%- endif -%}
        {%- endif -%}
        {%- if p.get('textColor') == 'palette' and (var_palette_speed | float(0)) > 0 -%}
          {%- set p = dict(p, paletteSpeed=var_palette_speed | float) -%}
        {%- endif -%}
        {%- set scroll = {} -%}
        {%- if var_scroll_mode -%}
          {%- set scroll = dict(scroll, mode=var_scroll_mode) -%}
        {%- endif -%}
        {%- if (var_scroll_speed | int) > 0 -%}
          {%- set scroll = dict(scroll, speed=var_scroll_speed | int) -%}
        {%- endif -%}
        {%- if scroll -%}
          {%- set p = dict(p, scroll=scroll) -%}
        {%- endif -%}
        {%- if (var_repeat | int) > 0 -%}
          {%- set p = dict(p, repeat=var_repeat | int) -%}
        {%- endif -%}
        {%- if var_enable_background_color -%}
          {%- set p = dict(p, backgroundColor=var_background_color) -%}
        {%- endif -%}
        {#- The template overrides the entity. The entity is scaled to a percentage using the
            manual maximum, the min/max attributes of number helpers, or 0-100. -#}
        {%- set pr = namespace(value=none) -%}
        {%- set progress = '' if var_progress is none else (var_progress | string | trim) -%}
        {%- if progress | is_number -%}
          {%- set pr.value = progress | float -%}
        {%- elif var_progress_entity and states(var_progress_entity) | is_number -%}
          {%- if (var_progress_max | float(0)) != 0 -%}
            {%- set range_min = var_progress_min | float(0) -%}
            {%- set range_max = var_progress_max | float -%}
          {%- elif var_progress_entity.split('.')[0] in ['number', 'input_number'] -%}
            {%- set range_min = state_attr(var_progress_entity, 'min') | float(0) -%}
            {%- set range_max = state_attr(var_progress_entity, 'max') | float(100) -%}
          {%- else -%}
            {%- set range_min = 0 -%}
            {%- set range_max = 100 -%}
          {%- endif -%}
          {%- if range_max != range_min -%}
            {%- set pr.value = (states(var_progress_entity) | float - range_min) / (range_max - range_min) * 100 -%}
          {%- endif -%}
        {%- endif -%}
        {%- if pr.value is not none -%}
          {%- set p = dict(p, progress=[[pr.value | round(0) | int, 0] | max, 100] | min, progressColor=var_progress_color, progressTrackColor=var_progress_track_color) -%}
        {%- endif -%}
        {%- if var_icon -%}
          {%- set p = dict(p, icon=var_icon | string, iconMode=var_icon_push) -%}
        {%- endif -%}
        {%- if (var_duration | int) > 0 -%}
          {%- set p = dict(p, durationMs=(var_duration | int) * 1000) -%}
        {%- endif -%}
        {%- if var_overlayeffect -%}
          {%- set p = dict(p, overlay=var_overlayeffect) -%}
        {%- endif -%}
        {%- if var_backgroundeffect -%}
          {%- set p = dict(p, effect=var_backgroundeffect) -%}
        {%- endif -%}
        {%- if var_rtttl -%}
          {%- set p = dict(p, soundRtttl=var_rtttl | string, soundLoop=var_loopSound | bool) -%}
        {%- endif -%}
        {{ p | to_json }}

  - service: mqtt.publish
    data:
      topic: "{{ var_topicnotifyname }}"
      payload: "{{ payload_data }}"

  - if:
      - condition: template
        value_template: "{{ var_enable_dismiss }}"
    then:
      - wait_for_trigger: !input input_dismiss_trigger
      - service: mqtt.publish
        data:
          topic: "{{ states(var_topic) }}/cmd/notify/dismiss/{{ var_notification_name }}"
          payload: ""
