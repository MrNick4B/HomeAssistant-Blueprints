blueprint:
  name: "AWTRIX NG App"
  description: "Publiceer een pushed app naar AWTRIX NG via MQTT."
  domain: automation
  author: "MrNick4B"
  homeassistant:
    min_version: "2025.7.0"
  source_url: "https://github.com/MrNick4B/HomeAssistant-Blueprints/blob/main/AWTRIX%20NG/App/awtrix-ng-app_nl.yaml"
  input:
    section_general:
      name: "Basisinstellingen"
      icon: mdi:cog
      description: "Stel de basisinstellingen in."
      input:
        input_awtrix_device_topic:
          name: "MQTT-prefix"
          description: "Kies de MQTT-prefix-entiteit van het gewenste AWTRIX NG-apparaat.\n(Bijvoorbeeld sensor.awtrix_ng_mqtt_prefix)"
          selector:
            entity:
              integration: mqtt
              domain: sensor
        input_app_name:
          name: "Appnaam"
          description: "Kies een unieke naam voor de app.\nAlleen letters, cijfers, _ en - zijn toegestaan (max. 32 tekens). Andere tekens worden vervangen door _."
          selector:
            text:
        input_duration:
          name: "Duur"
          description: "De duur waarin de app wordt weergegeven.\n0 = standaardduur van het apparaat."
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "s"
        input_app_publish_on_boot:
          name: "Start app bij opstarten"
          description: "Start de app onmiddellijk wanneer het apparaat opgestart wordt.\nWordt ook getriggerd als de automation aangepast wordt."
          default: false
          selector:
            boolean:
        input_app_update_trigger:
          name: "Trigger"
          description: "Trigger voor het bijwerken van de gegevens in de app."
          default: null
          selector:
            trigger:
        input_app_update_condition:
          name: "Conditie"
          description: "Conditie voor het bijwerken van de gegevens in de app."
          default: null
          selector:
            condition:
    section_text:
      name: "Tekst"
      icon: mdi:card-text
      description: "Stel de weergegeven tekst in."
      input:
        input_text:
          name: "Tekst"
          description: "De tekst die weergegeven wordt. Ondersteunt ook templates."
          default: null
          selector:
            template:
        input_text_entities:
          name: "Entiteiten"
          description: "Kies een of meerdere entiteiten waarvan de status weergegeven wordt."
          default: ""
          selector:
            entity:
              multiple: true
        input_show_units:
          name: "Toon eenheden"
          description: "Kies of de eenheden van de entiteiten weergegeven moeten worden."
          default: true
          selector:
            boolean:
    section_icon:
      name: "Pictogram"
      icon: mdi:image
      description: "Pas het weergegeven pictogram aan."
      input:
        input_icon:
          name: "Pictogram"
          description: "Voer de ID of de naam van het pictogram in."
          default: ""
          selector:
            text:
        input_icon_push:
          name: "Beweging pictogram"
          description: "Kies of het pictogram met tekst meebeweegt en hoe vaak dit gebeurt."
          default: "fixed"
          selector:
            select:
              options:
                - label: "Blijft staan"
                  value: "fixed"
                - label: "Beweegt eenmalig met de tekst mee"
                  value: "pushOnce"
                - label: "Beweegt herhaaldelijk met de tekst mee"
                  value: "push"
    section_textformatting:
      name: "Tekstopties"
      icon: mdi:format-text
      description: "Instellingen voor de tekstweergave."
      collapsed: true
      input:
        input_text_case:
          name: "Hoofdlettergebruik"
          description: "Past de weergave van hoofdletters in de tekst aan."
          default: "inherit"
          selector:
            select:
              options:
                - label: "Standaardinstelling van het apparaat"
                  value: "inherit"
                - label: "Alleen hoofdletters"
                  value: "upper"
                - label: "Zoals ingevoerd"
                  value: "asTyped"
        input_blink_text:
          name: "Knipperende tekst"
          description: "Laat de tekst knipperen. Werkt niet als het regenboogeffect, een gradient of een palet is ingeschakeld."
          default: 0
          selector:
            number:
              min: 0
              max: 5000
              step: 100
              unit_of_measurement: "ms"
        input_fade_text:
          name: "Vervagingseffect"
          description: "Laat de tekst knipperen met een vervagingseffect. Gaat voor op knipperende tekst. Werkt niet als het regenboogeffect, een gradient of een palet is ingeschakeld."
          default: 0
          selector:
            number:
              min: 0
              max: 5000
              step: 100
              unit_of_measurement: "ms"
        input_scroll_mode:
          name: "Scrollmodus"
          description: "Hoe tekst beweegt die niet op het scherm past."
          default: ""
          selector:
            select:
              options:
                - label: "Standaardinstelling van het apparaat"
                  value: ""
                - label: "Doorscrollen en opnieuw beginnen"
                  value: "wrap"
                - label: "Doorlopende lus"
                  value: "loop"
                - label: "Heen en weer"
                  value: "bounce"
                - label: "Niet scrollen"
                  value: "static"
        input_scroll_speed:
          name: "Scrollsnelheid"
          description: "Scrollsnelheid als percentage van de normale snelheid.\n0 = standaardsnelheid van het apparaat."
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 10
              unit_of_measurement: "%"
        input_repeat:
          name: "Tekst herhalen"
          description: "Blijf weergeven tot de scrollende tekst zo vaak over het scherm is gelopen. Als er een duur is ingesteld, wordt minstens zo lang weergegeven.\n0 = uit."
          default: 0
          selector:
            number:
              min: 0
              max: 10
              step: 1
    section_colors:
      name: "Kleuropties"
      icon: mdi:palette
      description: "Pas de tekst- en achtergrondkleuren aan."
      collapsed: true
      input:
        input_enable_text_color:
          name: "Aangepaste tekstkleur inschakelen"
          description: "Werkt niet als het regenboogeffect is ingeschakeld."
          default: "0"
          selector:
            select:
              options:
                - label: "Geen aangepaste kleur"
                  value: "0"
                - label: "Enkele kleur"
                  value: "1"
                - label: "Gradient"
                  value: "2"
                - label: "Palet"
                  value: "3"
        input_text_color_1:
          name: "Eerste tekstkleur"
          description: "Bij een gradient begint de tekst met deze kleur."
          default: [0, 128, 255]
          selector:
            color_rgb:
        input_text_color_2:
          name: "Tweede tekstkleur"
          description: "Bij een gradient eindigt de tekst met deze kleur."
          default: [255, 0, 128]
          selector:
            color_rgb:
        input_palette:
          name: "Palet"
          description: "Palet voor de tekst als Palet als tekstkleur gekozen is. Je kunt ook de naam van een eigen paletbestand invullen. Het palet kleurt ook het achtergrondeffect en de overlay."
          default: "Rainbow"
          selector:
            select:
              custom_value: true
              options:
                - "Rainbow"
                - "Party"
                - "Heat"
                - "Lava"
                - "Ocean"
                - "Forest"
                - "Cloud"
                - "Stripe"
        input_palette_speed:
          name: "Kleurbeweging"
          description: "Laat de kleuren van een regenboog, gradient of palet over de tekst bewegen, in doorgangen per seconde.\n0 = geen beweging."
          default: 0
          selector:
            number:
              min: 0
              max: 10
              step: 0.1
        input_enable_background_color:
          name: "Aangepaste achtergrondkleur inschakelen"
          description: "Schakel de optie achtergrondkleur in. Wordt genegeerd als er een achtergrondeffect gekozen is."
          default: false
          selector:
            boolean:
        input_background_color:
          name: "Achtergrondkleur"
          description: "Kies een aangepaste achtergrondkleur."
          default: [255, 255, 255]
          selector:
            color_rgb:
        input_rainbow:
          name: "Regenboogeffect"
          description: "Geeft de tekst een regenboogeffect. Overschrijft aangepaste tekstkleur."
          default: false
          selector:
            boolean:
    section_progress:
      name: "Voortgangsbalk"
      icon: mdi:progress-helper
      description: "Toon een voortgangsbalk op de onderste rij."
      collapsed: true
      input:
        input_progress_entity:
          name: "Voortgangsentiteit"
          description: "Entiteit waarvan de status als voortgang getoond wordt, bijvoorbeeld een batterijniveau."
          default: ""
          selector:
            entity:
              domain:
                - sensor
                - number
                - input_number
        input_progress_max:
          name: "Maximum"
          description: "Waarde waarbij de voortgangsbalk vol is. Alleen nodig voor sensoren die geen percentage geven, bijvoorbeeld 200 voor een regenton van 200 L.\n0 = automatisch."
          default: 0
          selector:
            number:
              mode: box
              step: any
        input_progress_min:
          name: "Minimum"
          description: "Waarde waarbij de voortgangsbalk leeg is. Wordt alleen gebruikt als er een maximum ingesteld is."
          default: 0
          selector:
            number:
              mode: box
              step: any
        input_progress:
          name: "Voortgangstemplate"
          description: "Gebruik een template dat een waarde tussen 0 en 100 teruggeeft. Gaat voor op de voortgangsentiteit."
          default: null
          selector:
            template:
        input_progress_color:
          name: "Voortgangskleur"
          description: "Kleur van het gevulde deel van de voortgangsbalk."
          default: [255, 255, 255]
          selector:
            color_rgb:
        input_progress_track_color:
          name: "Achtergrondkleur balk"
          description: "Kleur van het niet-gevulde deel van de voortgangsbalk."
          default: [96, 96, 96]
          selector:
            color_rgb:
    section_effects:
      name: "Effecten"
      icon: mdi:animation
      description: "Beheer overlay- en achtergrondeffecten."
      collapsed: true
      input:
        input_overlayeffect:
          name: "Overlay-effect"
          description: "Selecteer een overlayeffect."
          default: ""
          selector:
            select:
              options:
                - label: "Standaard van het apparaat (globale overlay)"
                  value: ""
                - label: "Sneeuw"
                  value: "snow"
                - label: "Regen"
                  value: "rain"
                - label: "Motregen"
                  value: "drizzle"
                - label: "Storm"
                  value: "storm"
                - label: "Onweer"
                  value: "thunder"
                - label: "Vorst"
                  value: "frost"
        input_backgroundeffect:
          name: "Achtergrondeffect"
          description: "Selecteer een achtergrondeffect."
          default: ""
          selector:
            select:
              options:
                - label: "Geen effect"
                  value: ""
                - label: "Fade"
                  value: "Fade"
                - label: "MovingLine"
                  value: "MovingLine"
                - label: "BrickBreaker"
                  value: "BrickBreaker"
                - label: "PingPong"
                  value: "PingPong"
                - label: "Radar"
                  value: "Radar"
                - label: "Checkerboard"
                  value: "Checkerboard"
                - label: "Fireworks"
                  value: "Fireworks"
                - label: "PlasmaCloud"
                  value: "PlasmaCloud"
                - label: "Ripple"
                  value: "Ripple"
                - label: "Snake"
                  value: "Snake"
                - label: "Pacifica"
                  value: "Pacifica"
                - label: "TheaterChase"
                  value: "TheaterChase"
                - label: "Plasma"
                  value: "Plasma"
                - label: "Matrix"
                  value: "Matrix"
                - label: "SwirlIn"
                  value: "SwirlIn"
                - label: "SwirlOut"
                  value: "SwirlOut"
                - label: "LookingEyes"
                  value: "LookingEyes"
                - label: "TwinklingStars"
                  value: "TwinklingStars"
                - label: "ColorWaves"
                  value: "ColorWaves"
    section_advanced:
      name: "Levensduur en verwijderen"
      icon: mdi:delete-clock
      description: "Wanneer de app verloopt of verwijderd wordt."
      collapsed: true
      input:
        input_lifetime:
          name: "Levensduur"
          description: "Hoe lang het duurt voordat de app verloopt.\n0:00:00 = geen levensduur."
          default: "0:00:00"
          selector:
            duration:
        input_lifetimeMode:
          name: "Levensduurmodus"
          description: "Wat er met de app moet gebeuren als de levensduur bereikt is."
          default: "remove"
          selector:
            select:
              options:
                - label: "Verwijder de app"
                  value: "remove"
                - label: "Markeer als verlopen (rode rand)"
                  value: "mark"
        input_remove_when_unavailable:
          name: "Verwijder app bij onbeschikbaarheid"
          description: "Verwijder de app van het apparaat als een van de gekozen entiteiten onbeschikbaar (unavailable) is. De app komt terug zodra alle entiteiten weer beschikbaar zijn."
          default: false
          selector:
            boolean:
        input_remove_condition:
          name: "Verwijder-conditie"
          description: "Verwijder de app als aan een van de volgende condities wordt voldaan."
          default: []
          selector:
            condition:
mode: single

trigger_variables:
  var_trigger_entities: !input input_text_entities

trigger:
  - platform: mqtt
    topic: "+/availability" # So this seems to not support variables. Further filtering by using conditions.
    payload: "online"
    id: awtrix_online
    enabled: !input input_app_publish_on_boot
  # Template triggers instead of state triggers, because a state trigger is invalid without entities.
  - platform: template
    value_template: "{{ (var_trigger_entities or []) | map('states') | select('eq', 'unavailable') | list | count > 0 }}"
    id: awtrix_entities_unavailable
    enabled: !input input_remove_when_unavailable
  - platform: template
    value_template: "{{ (var_trigger_entities or []) | map('states') | select('eq', 'unavailable') | list | count == 0 }}"
    id: awtrix_entities_available
    enabled: !input input_remove_when_unavailable
  - triggers: !input input_app_update_trigger

variables:
  device_topic: !input input_awtrix_device_topic

# Removing the app bypasses the user condition; bringing it back is a regular update.
condition:
  - condition: or
    conditions:
      - condition: and
        conditions:
          - condition: trigger
            id: awtrix_online
          - condition: template
            value_template: "{{ trigger.topic == states(device_topic) ~ '/availability' }}"
      - condition: trigger
        id: awtrix_entities_unavailable
      - condition: and
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id:
                  - awtrix_online
                  - awtrix_entities_unavailable
          - or:
              - or: !input input_remove_condition
              - and: !input input_app_update_condition

action:
  - variables:
      var_topic: !input input_awtrix_device_topic
      var_appname: !input input_app_name
      var_text: !input input_text
      var_text_entities: !input input_text_entities
      var_show_units: !input input_show_units
      var_text_case: !input input_text_case
      var_icon: !input input_icon
      var_icon_push: !input input_icon_push
      var_duration: !input input_duration
      var_rainbow: !input input_rainbow
      var_blink_text: !input input_blink_text
      var_fade_text: !input input_fade_text
      var_scroll_mode: !input input_scroll_mode
      var_scroll_speed: !input input_scroll_speed
      var_repeat: !input input_repeat
      var_enable_text_color: !input input_enable_text_color
      var_text_color_1: !input input_text_color_1
      var_text_color_2: !input input_text_color_2
      var_palette: !input input_palette
      var_palette_speed: !input input_palette_speed
      var_enable_background_color: !input input_enable_background_color
      var_background_color: !input input_background_color
      var_progress: !input input_progress
      var_progress_entity: !input input_progress_entity
      var_progress_min: !input input_progress_min
      var_progress_max: !input input_progress_max
      var_progress_color: !input input_progress_color
      var_progress_track_color: !input input_progress_track_color
      var_overlayeffect: !input input_overlayeffect
      var_backgroundeffect: !input input_backgroundeffect
      var_lifetime: !input input_lifetime
      var_lifetime_mode: !input input_lifetimeMode
      var_remove_when_unavailable: !input input_remove_when_unavailable
      var_topicappname: >-
        {{ states(var_topic) }}/cmd/apps/pushed/{{ (var_appname | string | regex_replace('[^A-Za-z0-9_-]', '_'))[:32] }}
      var_entities_unavailable: >-
        {{ (var_text_entities or []) | map('states') | select('eq', 'unavailable') | list | count > 0 }}
      var_lifetime_seconds: >-
        {% if var_lifetime is mapping %}
          {{ (var_lifetime.get('days', 0) * 86400) + (var_lifetime.get('hours', 0) * 3600) + (var_lifetime.get('minutes', 0) * 60) + var_lifetime.get('seconds', 0) }}
        {% else %}
          0
        {% endif %}
      # Built as a dict and serialized with to_json, so text with quotes stays valid JSON
      # and booleans are sent as true/false (AWTRIX NG skips keys with the wrong JSON type).
      payload_data: >-
        {%- set ns = namespace(result=[]) -%}
        {%- if var_text_entities -%}
          {%- for entity in var_text_entities -%}
            {%- set state = states(entity) -%}
            {%- set unit = state_attr(entity, "unit_of_measurement") -%}
            {%- if state not in ['unknown', 'unavailable', 'None'] -%}
              {%- if var_show_units and unit -%}
                {%- set ns.result = ns.result + [state ~ unit] -%}
              {%- else -%}
                {%- set ns.result = ns.result + [state] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set text = '' if var_text is none else (var_text | string | trim) -%}
        {%- set p = {'text': ([text] + ns.result) | select | join(' '), 'textCase': var_text_case} -%}
        {%- if var_rainbow -%}
          {%- set p = dict(p, palette='Rainbow', textColor='palette') -%}
        {%- elif var_enable_text_color == '2' -%}
          {%- set p = dict(p, palette=[var_text_color_1, var_text_color_2], textColor='palette') -%}
        {%- elif var_enable_text_color == '3' and var_palette -%}
          {%- set p = dict(p, palette=var_palette | string, textColor='palette') -%}
        {%- else -%}
          {%- if var_enable_text_color == '1' -%}
            {%- set p = dict(p, textColor=var_text_color_1) -%}
          {%- endif -%}
          {%- if (var_blink_text | int) > 0 -%}
            {%- set p = dict(p, textBlinkMs=var_blink_text | int) -%}
          {%- endif -%}
          {%- if (var_fade_text | int) > 0 -%}
            {%- set p = dict(p, textFadeMs=var_fade_text | int) -%}
          {%- endif -%}
        {%- endif -%}
        {%- if p.get('textColor') == 'palette' and (var_palette_speed | float(0)) > 0 -%}
          {%- set p = dict(p, paletteSpeed=var_palette_speed | float) -%}
        {%- endif -%}
        {%- set scroll = {} -%}
        {%- if var_scroll_mode -%}
          {%- set scroll = dict(scroll, mode=var_scroll_mode) -%}
        {%- endif -%}
        {%- if (var_scroll_speed | int) > 0 -%}
          {%- set scroll = dict(scroll, speed=var_scroll_speed | int) -%}
        {%- endif -%}
        {%- if scroll -%}
          {%- set p = dict(p, scroll=scroll) -%}
        {%- endif -%}
        {%- if (var_repeat | int) > 0 -%}
          {%- set p = dict(p, repeat=var_repeat | int) -%}
        {%- endif -%}
        {%- if var_enable_background_color -%}
          {%- set p = dict(p, backgroundColor=var_background_color) -%}
        {%- endif -%}
        {#- The template overrides the entity. The entity is scaled to a percentage using the
            manual maximum, the min/max attributes of number helpers, or 0-100. -#}
        {%- set pr = namespace(value=none) -%}
        {%- set progress = '' if var_progress is none else (var_progress | string | trim) -%}
        {%- if progress | is_number -%}
          {%- set pr.value = progress | float -%}
        {%- elif var_progress_entity and states(var_progress_entity) | is_number -%}
          {%- if (var_progress_max | float(0)) != 0 -%}
            {%- set range_min = var_progress_min | float(0) -%}
            {%- set range_max = var_progress_max | float -%}
          {%- elif var_progress_entity.split('.')[0] in ['number', 'input_number'] -%}
            {%- set range_min = state_attr(var_progress_entity, 'min') | float(0) -%}
            {%- set range_max = state_attr(var_progress_entity, 'max') | float(100) -%}
          {%- else -%}
            {%- set range_min = 0 -%}
            {%- set range_max = 100 -%}
          {%- endif -%}
          {%- if range_max != range_min -%}
            {%- set pr.value = (states(var_progress_entity) | float - range_min) / (range_max - range_min) * 100 -%}
          {%- endif -%}
        {%- endif -%}
        {%- if pr.value is not none -%}
          {%- set p = dict(p, progress=[[pr.value | round(0) | int, 0] | max, 100] | min, progressColor=var_progress_color, progressTrackColor=var_progress_track_color) -%}
        {%- endif -%}
        {%- if var_icon -%}
          {%- set p = dict(p, icon=var_icon | string, iconMode=var_icon_push) -%}
        {%- endif -%}
        {%- if (var_duration | int) > 0 -%}
          {%- set p = dict(p, durationMs=(var_duration | int) * 1000) -%}
        {%- endif -%}
        {%- if var_overlayeffect -%}
          {%- set p = dict(p, overlay=var_overlayeffect) -%}
        {%- endif -%}
        {%- if var_backgroundeffect -%}
          {%- set p = dict(p, effect=var_backgroundeffect) -%}
        {%- endif -%}
        {%- if (var_lifetime_seconds | int) > 0 -%}
          {%- set p = dict(p, lifetimeMs=(var_lifetime_seconds | int) * 1000, lifetimeExpiry=var_lifetime_mode) -%}
        {%- endif -%}
        {{ p | to_json }}

  - if:
      - or:
          - condition: template
            value_template: "{{ var_remove_when_unavailable and var_entities_unavailable }}"
          - or: !input input_remove_condition
    then:
      # An empty payload removes the pushed app from the device.
      - service: mqtt.publish
        data:
          topic: "{{ var_topicappname }}"
          payload: ""
    else:
      - service: mqtt.publish
        data:
          topic: "{{ var_topicappname }}"
          payload: "{{ payload_data }}"
