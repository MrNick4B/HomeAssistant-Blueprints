blueprint:
  name: "AWTRIX NG App"
  description: "Publish a pushed app to AWTRIX NG via MQTT."
  domain: automation
  author: "MrNick4B"
  homeassistant:
    min_version: "2025.7.0"
  source_url: "https://github.com/MrNick4B/HomeAssistant-Blueprints/blob/main/AWTRIX%20NG/App/awtrix-ng-app.yaml"
  input:
    section_general:
      name: "General Settings"
      icon: mdi:cog
      description: "Configure the general settings."
      input:
        input_awtrix_device_topic:
          name: "MQTT Prefix"
          description: "Select the MQTT prefix entity of the desired AWTRIX NG device.\n(For example sensor.awtrix_ng_mqtt_prefix)"
          selector:
            entity:
              integration: mqtt
              domain: sensor
        input_app_name:
          name: "App Name"
          description: "Choose a unique name for the app.\nOnly letters, digits, _ and - are allowed (max. 32 characters). Other characters are replaced by _."
          selector:
            text:
        input_duration:
          name: "Duration"
          description: "The duration for which the app is displayed.\n0 = default duration of the device."
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "s"
        input_app_publish_on_boot:
          name: "Start app on boot"
          description: "Start the app immediately when the device boots up.\nAlso triggered when the automation is modified."
          default: false
          selector:
            boolean:
        input_app_update_trigger:
          name: "Trigger"
          description: "Trigger for updating the data in the app."
          default: null
          selector:
            trigger:
        input_app_update_condition:
          name: "Condition"
          description: "Condition for updating the data in the app."
          default: null
          selector:
            condition:
    section_text:
      name: "Text"
      icon: mdi:card-text
      description: "Configure the displayed text."
      input:
        input_text:
          name: "Text"
          description: "The text to be displayed. Also supports templates."
          default: null
          selector:
            template:
        input_text_entities:
          name: "Entities"
          description: "Select one or more entities whose status will be displayed."
          default: ""
          selector:
            entity:
              multiple: true
        input_show_units:
          name: "Show Units"
          description: "Choose whether to display the units of the entities."
          default: true
          selector:
            boolean:
    section_icon:
      name: "Icon"
      icon: mdi:image
      description: "Customize the displayed icon."
      input:
        input_icon:
          name: "Icon"
          description: "Enter the ID or name of the icon."
          default: ""
          selector:
            text:
        input_icon_push:
          name: "Icon Movement"
          description: "Choose whether the icon moves with the text and how often this happens."
          default: "fixed"
          selector:
            select:
              options:
                - label: "Stays in place"
                  value: "fixed"
                - label: "Moves once with the text"
                  value: "pushOnce"
                - label: "Moves repeatedly with the text"
                  value: "push"
    section_textformatting:
      name: "Text Options"
      icon: mdi:format-text
      description: "Settings for text display."
      collapsed: true
      input:
        input_text_case:
          name: "Text Case"
          description: "Adjust the case of the text."
          default: "inherit"
          selector:
            select:
              options:
                - label: "Device default setting"
                  value: "inherit"
                - label: "Uppercase only"
                  value: "upper"
                - label: "As entered"
                  value: "asTyped"
        input_blink_text:
          name: "Blinking Text"
          description: "Make the text blink. Does not work if the rainbow effect or a gradient is enabled."
          default: 0
          selector:
            number:
              min: 0
              max: 5000
              step: 100
              unit_of_measurement: "ms"
        input_fade_text:
          name: "Fade Effect"
          description: "Make the text blink with a fade effect. Takes precedence over blinking text. Does not work if the rainbow effect or a gradient is enabled."
          default: 0
          selector:
            number:
              min: 0
              max: 5000
              step: 100
              unit_of_measurement: "ms"
    section_colors:
      name: "Color Options"
      icon: mdi:palette
      description: "Customize the text and background colors."
      collapsed: true
      input:
        input_enable_text_color:
          name: "Enable Custom Text Color"
          description: "Does not work if the rainbow effect is enabled."
          default: "0"
          selector:
            select:
              options:
                - label: "No custom color"
                  value: "0"
                - label: "Single color"
                  value: "1"
                - label: "Gradient"
                  value: "2"
        input_text_color_1:
          name: "First Text Color"
          description: "For a gradient, the text starts with this color."
          default: [0, 128, 255]
          selector:
            color_rgb:
        input_text_color_2:
          name: "Second Text Color"
          description: "For a gradient, the text ends with this color."
          default: [255, 0, 128]
          selector:
            color_rgb:
        input_enable_background_color:
          name: "Enable Custom Background Color"
          description: "Enable the background color option. Ignored when a background effect is selected."
          default: false
          selector:
            boolean:
        input_background_color:
          name: "Background Color"
          description: "Choose a custom background color."
          default: [255, 255, 255]
          selector:
            color_rgb:
        input_rainbow:
          name: "Rainbow Effect"
          description: "Give the text a rainbow effect. Overrides custom text color."
          default: false
          selector:
            boolean:
    section_effects:
      name: "Effects"
      icon: mdi:animation
      description: "Manage overlay and background effects."
      collapsed: true
      input:
        input_overlayeffect:
          name: "Overlay Effect"
          description: "Select an overlay effect."
          default: ""
          selector:
            select:
              options:
                - label: "Device default (global overlay)"
                  value: ""
                - label: "Snow"
                  value: "snow"
                - label: "Rain"
                  value: "rain"
                - label: "Drizzle"
                  value: "drizzle"
                - label: "Storm"
                  value: "storm"
                - label: "Thunder"
                  value: "thunder"
                - label: "Frost"
                  value: "frost"
        input_backgroundeffect:
          name: "Background Effect"
          description: "Select a background effect."
          default: ""
          selector:
            select:
              options:
                - label: "No effect"
                  value: ""
                - label: "Fade"
                  value: "Fade"
                - label: "MovingLine"
                  value: "MovingLine"
                - label: "BrickBreaker"
                  value: "BrickBreaker"
                - label: "PingPong"
                  value: "PingPong"
                - label: "Radar"
                  value: "Radar"
                - label: "Checkerboard"
                  value: "Checkerboard"
                - label: "Fireworks"
                  value: "Fireworks"
                - label: "PlasmaCloud"
                  value: "PlasmaCloud"
                - label: "Ripple"
                  value: "Ripple"
                - label: "Snake"
                  value: "Snake"
                - label: "Pacifica"
                  value: "Pacifica"
                - label: "TheaterChase"
                  value: "TheaterChase"
                - label: "Plasma"
                  value: "Plasma"
                - label: "Matrix"
                  value: "Matrix"
                - label: "SwirlIn"
                  value: "SwirlIn"
                - label: "SwirlOut"
                  value: "SwirlOut"
                - label: "LookingEyes"
                  value: "LookingEyes"
                - label: "TwinklingStars"
                  value: "TwinklingStars"
                - label: "ColorWaves"
                  value: "ColorWaves"
    section_advanced:
      name: "Advanced Settings"
      icon: mdi:tune
      description: "Additional settings."
      collapsed: true
      input:
        input_lifetime:
          name: "Lifetime"
          description: "How long it takes for the app to expire.\n0:00:00 = no lifetime."
          default: "0:00:00"
          selector:
            duration:
        input_lifetimeMode:
          name: "Lifetime Mode"
          description: "What to do with the app when the lifetime is reached."
          default: "remove"
          selector:
            select:
              options:
                - label: "Remove the app"
                  value: "remove"
                - label: "Mark as expired (red border)"
                  value: "mark"
mode: single

trigger:
  - platform: mqtt
    topic: "+/availability" # So this seems to not support variables. Further filtering by using conditions.
    payload: "online"
    id: awtrix_online
    enabled: !input input_app_publish_on_boot
  - triggers: !input input_app_update_trigger

variables:
  device_topic: !input input_awtrix_device_topic

condition:
  - condition: or
    conditions:
      - condition: and
        conditions:
          - condition: trigger
            id: awtrix_online
          - condition: template
            value_template: "{{ trigger.topic == states(device_topic) ~ '/availability' }}"
      - condition: and
        conditions:
          - condition: not
            conditions:
              - condition: trigger
                id: awtrix_online
          - and: !input input_app_update_condition

action:
  - variables:
      var_topic: !input input_awtrix_device_topic
      var_appname: !input input_app_name
      var_text: !input input_text
      var_text_entities: !input input_text_entities
      var_show_units: !input input_show_units
      var_text_case: !input input_text_case
      var_icon: !input input_icon
      var_icon_push: !input input_icon_push
      var_duration: !input input_duration
      var_rainbow: !input input_rainbow
      var_blink_text: !input input_blink_text
      var_fade_text: !input input_fade_text
      var_enable_text_color: !input input_enable_text_color
      var_text_color_1: !input input_text_color_1
      var_text_color_2: !input input_text_color_2
      var_enable_background_color: !input input_enable_background_color
      var_background_color: !input input_background_color
      var_overlayeffect: !input input_overlayeffect
      var_backgroundeffect: !input input_backgroundeffect
      var_lifetime: !input input_lifetime
      var_lifetime_mode: !input input_lifetimeMode
      var_topicappname: >-
        {{ states(var_topic) }}/cmd/apps/pushed/{{ (var_appname | string | regex_replace('[^A-Za-z0-9_-]', '_'))[:32] }}
      var_lifetime_seconds: >-
        {% if var_lifetime is mapping %}
          {{ (var_lifetime.get('days', 0) * 86400) + (var_lifetime.get('hours', 0) * 3600) + (var_lifetime.get('minutes', 0) * 60) + var_lifetime.get('seconds', 0) }}
        {% else %}
          0
        {% endif %}
      # Built as a dict and serialized with to_json, so text with quotes stays valid JSON
      # and booleans are sent as true/false (AWTRIX NG skips keys with the wrong JSON type).
      payload_data: >-
        {%- set ns = namespace(result=[]) -%}
        {%- if var_text_entities -%}
          {%- for entity in var_text_entities -%}
            {%- set state = states(entity) -%}
            {%- set unit = state_attr(entity, "unit_of_measurement") -%}
            {%- if state not in ['unknown', 'unavailable', 'None'] -%}
              {%- if var_show_units and unit -%}
                {%- set ns.result = ns.result + [state ~ unit] -%}
              {%- else -%}
                {%- set ns.result = ns.result + [state] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set text = '' if var_text is none else (var_text | string | trim) -%}
        {%- set p = {'text': ([text] + ns.result) | select | join(' '), 'textCase': var_text_case} -%}
        {%- if var_rainbow -%}
          {%- set p = dict(p, palette='Rainbow', textColor='palette') -%}
        {%- elif var_enable_text_color == '2' -%}
          {%- set p = dict(p, palette=[var_text_color_1, var_text_color_2], textColor='palette') -%}
        {%- else -%}
          {%- if var_enable_text_color == '1' -%}
            {%- set p = dict(p, textColor=var_text_color_1) -%}
          {%- endif -%}
          {%- if (var_blink_text | int) > 0 -%}
            {%- set p = dict(p, textBlinkMs=var_blink_text | int) -%}
          {%- endif -%}
          {%- if (var_fade_text | int) > 0 -%}
            {%- set p = dict(p, textFadeMs=var_fade_text | int) -%}
          {%- endif -%}
        {%- endif -%}
        {%- if var_enable_background_color -%}
          {%- set p = dict(p, backgroundColor=var_background_color) -%}
        {%- endif -%}
        {%- if var_icon -%}
          {%- set p = dict(p, icon=var_icon | string, iconMode=var_icon_push) -%}
        {%- endif -%}
        {%- if (var_duration | int) > 0 -%}
          {%- set p = dict(p, durationMs=(var_duration | int) * 1000) -%}
        {%- endif -%}
        {%- if var_overlayeffect -%}
          {%- set p = dict(p, overlay=var_overlayeffect) -%}
        {%- endif -%}
        {%- if var_backgroundeffect -%}
          {%- set p = dict(p, effect=var_backgroundeffect) -%}
        {%- endif -%}
        {%- if (var_lifetime_seconds | int) > 0 -%}
          {%- set p = dict(p, lifetimeMs=(var_lifetime_seconds | int) * 1000, lifetimeExpiry=var_lifetime_mode) -%}
        {%- endif -%}
        {{ p | to_json }}

  - service: mqtt.publish
    data:
      topic: "{{ var_topicappname }}"
      payload: "{{ payload_data }}"
